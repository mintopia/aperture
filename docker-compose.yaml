name: aperture

services:
  aperture:
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    restart: unless-stopped
    environment:
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - PHP_IDE_CONFIG=serverName=control
      - XDEBUG_MODE=debug
      - XDEBUG_SESSION=start
      - CADDY_SERVER_FRANKENPHP_OPTIONS=
      - APP_INDEX_FILE=index.php
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis

  db:
    image: mariadb:10.5-focal
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - dbdata:/var/lib/mysql

  horizon:
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    restart: unless-stopped
    entrypoint: [ "php", "artisan", "horizon" ]
    env_file: .env
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis
    healthcheck:
      disable: true

  ssh-proxy:
    build:
      context: ./ssh-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SSH_PROXY_API_KEY=${APERTURE_SSH_PROXY_API_KEY}
      - SSH_PROXY_LISTEN_ADDR=0.0.0.0:8022
      - SSH_PROXY_IDLE_TIMEOUT=600
      - SSH_PROXY_SWEEP_INTERVAL=60
      - SSH_PROXY_COMMAND_TIMEOUT=30
      - SSH_PROXY_READ_TIMEOUT=5
      - SSH_PROXY_CONNECT_TIMEOUT=10
    ports:
      - "8022:8022"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8022/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    restart: unless-stopped
    entrypoint: [ "php", "artisan", "schedule:work" ]
    env_file: .env
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis
    healthcheck:
      disable: true

  redis:
    image: redis:6.0
    restart: unless-stopped

  composer:
    profiles: [ "composer" ]
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    entrypoint: [ "composer" ]
    command: [ "--version" ]
    volumes:
      - ./:/app
    healthcheck:
      disable: true

  test:
    profiles: [ "test" ]
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    entrypoint: [ "php", "vendor/bin/phpunit" ]
    volumes:
      - ./:/app
    healthcheck:
      disable: true

  npm:
    profiles: [ "npm" ]
    image: node:23
    entrypoint: [ "npm" ]
    command: [ "" ]
    working_dir: /app
    volumes:
      - ./:/app

  artisan:
    profiles: [ "artisan" ]
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    entrypoint: [ "php", "/app/artisan" ]
    volumes:
      - ./:/app/
    depends_on:
      - redis
      - db
    healthcheck:
      disable: true

  phpcs:
    profiles: [ "phpcs" ]
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    entrypoint: [ "vendor/bin/phpcs" ]
    volumes:
      - ./:/app/
    healthcheck:
      disable: true

  phpcbf:
    profiles: [ "phpcbf" ]
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    entrypoint: [ "vendor/bin/phpcbf" ]
    volumes:
      - ./:/app/
    healthcheck:
      disable: true

  shell:
    profiles: [ "shell" ]
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    entrypoint: [ "/bin/sh" ]
    volumes:
      - ./:/app/
    depends_on:
      - redis
      - db
    healthcheck:
      disable: true

volumes:
  dbdata:
    driver: local
