  - heading "1. Anti-Patterns Verdict — PASS" [level=2] [ref=e44]
  - paragraph [ref=e45]: "This design does NOT look AI-generated. Here's the evidence:"
  - list [ref=e46]:
    - listitem [ref=e47]:
      - strong [ref=e48]: Typography
      - text: ": Space Grotesk (headings) + Plus Jakarta Sans (body) is a distinctive, intentional pairing. Not Inter, Roboto, Open Sans, or system defaults. The monospace (JetBrains Mono) is tasteful for data."
    - listitem [ref=e49]:
      - strong [ref=e50]: Color palette
      - text: ": Warm zinc neutrals with indigo (#818cf8) primary + rose (#fb7185) accent. This is NOT the AI palette (cyan-on-dark, purple-blue gradients, neon accents). Custom properties are warm-tinted — not pure grays."
    - listitem [ref=e51]:
      - strong [ref=e52]: No gradient text
      - text: ": Zero instances. Headings use solid color or CSS custom properties. Stat values use explicit primary/accent colors. Correct."
    - listitem [ref=e53]:
      - strong [ref=e54]: No glassmorphism
      - text: ": One use of"
      - code [ref=e55]: backdrop-filter:blur(12px)
      - text: on the preview nav — functional, not decorative. No glass effects on cards.
    - listitem [ref=e56]:
      - strong [ref=e57]: Layout variety
      - text: ": Different grid proportions per section (2fr:1fr, 3fr:2fr, 3fr:1fr, 1fr:2fr). The \"detail strip\" pattern (S5, S6, S7) breaks the card-everything anti-pattern. Not uniform card grids."
    - listitem [ref=e58]:
      - strong [ref=e59]: No hero metric template
      - text: ": The \"42 Online\" stat on the admin dashboard is close but differentiated by the green-tinted card hero and percentage context. Not the standard \"big number + small label\" AI template."
  - paragraph [ref=e60]:
    - strong [ref=e61]: "Minor tells remaining:"
  - list [ref=e62]:
    - listitem [ref=e63]:
      - text: The QR code ring glow effect (
      - code [ref=e64]: "box-shadow: 0 0 24px var(--glow-pri)"
      - text: ) is a mild "AI neon" tell — but justified for a LAN party captive portal context
    - listitem [ref=e65]: Cards are still the primary containment pattern — there are many cards, though they're varied in size and accent treatment
    - listitem [ref=e66]: The dark mode default with warm accents could be read as "designed for dark, light mode tacked on" — but both modes appear deliberately designed
  - heading "2. What's Working" [level=2] [ref=e67]
  - generic [ref=e68]:
    - heading "Consistent Detail Page Pattern" [level=4] [ref=e69]
    - paragraph [ref=e70]: Sections S5 (User), S6 (IP), S7 (Port) all use a horizontal metadata strip at the top (no card wrapper), followed by content grids. This is a strong, repeatable pattern that creates consistency across admin detail views. The strip presents key info at a glance without wasting vertical space.
  - generic [ref=e71]:
    - heading "Dual-Color Bandwidth Charts with Proper Legends" [level=4] [ref=e72]
    - paragraph [ref=e73]: Every chart uses primary (solid) for download/inbound and accent (dashed) for upload/outbound. All have legends. The SVG area fill under the primary line adds visual weight. Chart gradient opacities adapt between dark and light modes via CSS variables. This is a well-executed data visualization pattern.
  - generic [ref=e74]:
    - heading "Captive Portal Focus" [level=4] [ref=e75]
    - paragraph [ref=e76]: S1 gets the UX right — QR code prominent, device code large and scannable (36px JetBrains Mono, letter-spaced), URL as secondary. The waiting state with pulsing dot is clear. The provisioning steps (S2) show real progress with done/active/pending states. This is a well-designed first-contact flow.
  - generic [ref=e77]:
    - heading "CSS Architecture" [level=4] [ref=e78]
    - paragraph [ref=e79]: Design system is expressed through CSS custom properties with named utility classes (.grid-21, .stat-row, .between, .mb-8, etc.). Light mode has its own dedicated property set (not just inverted). Separate code-bg, input-border, and preview-bg tokens show thoughtful separation of concerns.
  - generic [ref=e80]:
    - heading "Status Pill Accessibility" [level=4] [ref=e81]
    - paragraph [ref=e82]: Pills use distinct ::before pseudo-elements (✓ for ok, ✕ for bad, ▲ for warn) rather than relying on color alone. This addresses one of the most common accessibility oversights in dashboard design.
