    - heading "Sidebar Duplication Creates Visual Monotony" [level=4] [ref=e83]
    - generic [ref=e84]: "Category: Layout / Composition · Sections S4, S5, S6, S7"
    - paragraph [ref=e85]:
      - text: Now that S5, S6, and S7 all have the sidebar,
      - strong [ref=e86]: four consecutive mockup sections
      - text: (S4 + S5 + S6 + S7) have identical left sidebars. When scrolling through the preview, this creates a wall of repeated sidebar HTML that numbs the visual differentiation between sections.
    - paragraph [ref=e87]: The sidebar is correct for the real app (all admin pages share it). But in the wireframe preview, it makes sections harder to distinguish at a glance because the left 172px of every mockup is identical.
    - generic [ref=e88]:
      - strong [ref=e89]: "Mitigation:"
      - text: This is a wireframe concern, not an implementation concern. For the design preview only, consider adding a subtle visual indicator in the sidebar per section (e.g., a different border-left color on the active nav item for each section) or noting this is intentional. In the real app, the sidebar persists and the main area changes — the preview format just happens to repeat it.
